<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accueil – Séminaire MIDA</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #004080, #007acc);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    .container {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
      max-width: 700px;
      width: 90%;
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.2em;
      margin-top: 0;
      line-height: 1.6;
    }

    .group {
      margin-top: 30px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 20px;
    }

    .group h2 {
      margin-bottom: 15px;
      font-size: 1.5em;
      color: #fff;
    }

    .names {
      list-style: none;
      padding: 0;
      font-weight: bold;
    }

    .names li {
      margin: 5px 0;
    }

    .btn {
      margin-top: 30px;
      padding: 14px 28px;
      font-size: 1.1em;
      font-weight: bold;
      color: #004080;
      background: #ffffff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
    }

    .btn:hover {
      background: #e0e0e0;
      transform: scale(1.05);
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 2em;
      }

      p {
        font-size: 1em;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Bienvenue au Séminaire MIDA</h1>
    <p>Ce site présente des démonstrations interactives de failles de sécurité informatique comme les <strong>Buffer Overflow</strong>, le <strong>Canary</strong> et l' <strong>Escalade des privillèges</strong>.</p>

    <div class="group">
      <h2>Groupe 6 – Membres</h2>
      <ul class="names">
        <li>KELI Kekeli Christ</li>
        <li>KOUWADAN Ambroise</li>
        <li>KLIDJE</li>
        <li>CEPHAS</li>
        <li>KOMLA-EBRI Emanuel</li>
      </ul>
    </div>

    <button class="btn" onclick="window.location.href='index1.html'">
      Lancer la démonstration
    </button>
  </div>
</body>
</html>
